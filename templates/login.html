{% extends "base.html" %}
{% block title %}{{ _('Login - Plant Disease Detection') }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">
                    <i class="fas fa-sign-in-alt text-success"></i> {{ _('Login') }}
                </h3>
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="email" class="form-label">{{ _('Email Address') }}</label>
                        <input type="email" class="form-control" id="email" name="email"
                               required placeholder="{{ _('Enter your email') }}">
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="password" class="form-label mb-0">{{ _('Password') }}</label>
                            <a href="{{ url_for('auth.forgot_password') }}" class="text-success small text-decoration-none">{{ _('Forgot password?') }}</a>
                        </div>
                        <input type="password" class="form-control mt-2" id="password" name="password"
                               required placeholder="{{ _('Enter your password') }}">
                    </div>
                    <button type="submit" class="btn btn-success w-100">{{ _('Login') }}</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    {{ _("Don't have an account?") }}
                    <a href="{{ url_for('auth.register') }}" class="text-success">{{ _('Register here') }}</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
