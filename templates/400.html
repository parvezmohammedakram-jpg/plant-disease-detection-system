{% extends "base.html" %}
{% block title %}400 - Bad Request{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 text-muted">400</h1>
    <h3>{{ _('Bad Request') }}</h3>
    <p class="text-muted">{{ error_message or _('Your request could not be processed due to invalid parameters or expired security token.') }}</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-success">
        <i class="fas fa-home"></i> {{ _('Go Home') }}
    </a>
</div>
{% endblock %}
