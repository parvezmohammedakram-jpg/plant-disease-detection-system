{% extends "base.html" %}
{% block title %}{{ _('Register - Plant Disease Detection') }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">
                    <i class="fas fa-user-plus text-success"></i> {{ _('Create Account') }}
                </h3>
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="name" class="form-label">{{ _('Full Name') }}</label>
                        <input type="text" class="form-control" id="name" name="name"
                               required placeholder="{{ _('Enter your full name') }}">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">{{ _('Email Address') }}</label>
                        <input type="email" class="form-control" id="email" name="email"
                               required placeholder="{{ _('Enter your email') }}">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">{{ _('Password') }}</label>
                        <input type="password" class="form-control" id="password" name="password"
                               required minlength="6" placeholder="{{ _('Minimum 6 characters') }}">
                    </div>
                    <button type="submit" class="btn btn-success w-100">{{ _('Register') }}</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    {{ _('Already have an account?') }}
                    <a href="{{ url_for('auth.login') }}" class="text-success">{{ _('Login here') }}</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
