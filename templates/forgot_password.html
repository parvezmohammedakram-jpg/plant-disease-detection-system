{% extends "base.html" %}
{% block title %}Forgot Password - Plant Disease Detection{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">
                    <i class="fas fa-key text-success"></i> Reset Password
                </h3>
                <p class="text-muted text-center mb-4">
                    Enter your email address and we will send you a link to reset your password.
                </p>
                <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="farmer@example.com" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mb-3">
                        Send Reset Link
                    </button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Remember your password?
                    <a href="{{ url_for('auth.login') }}" class="text-success">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
