services:
  - type: web
    name: plant-disease-care
    env: python
    region: singapore # or frankfurt, oregon, ohio
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m babel.messages.frontend compile -d app/translations"
    startCommand: "gunicorn -c gunicorn.conf.py run:app"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: plant_disease_db
      - key: WEATHER_API_KEY
        sync: false
      - key: MAPS_API_KEY
        sync: false
